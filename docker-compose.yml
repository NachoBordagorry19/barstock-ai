services:
  db:
    image: postgres:15-alpine
    container_name: barstock-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-barstock_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-this-local-password}
      POSTGRES_DB: ${POSTGRES_DB:-barstock_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
